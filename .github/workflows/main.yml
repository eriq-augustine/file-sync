name: Main

on:
  - push
  - pull_request

jobs:
  test:

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up JDK 12
        uses: actions/setup-java@v6
        with:
          java-version: 12
          distribution: oracle-openjdk
          cache: maven

      - name: Build
        run: mvn clean verify
